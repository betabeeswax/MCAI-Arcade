name: Build and release Cardputer ADV firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run
      - name: Rename firmware
        run: cp .pio/build/m5stack-cardputer/firmware.bin MCAI-Arcade-Cardputer-ADV.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCAI-Arcade-Cardputer-ADV
          path: MCAI-Arcade-Cardputer-ADV.bin
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: MCAI Arcade v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: MCAI-Arcade-Cardputer-ADV.bin
